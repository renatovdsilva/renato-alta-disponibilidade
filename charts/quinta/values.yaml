replicaCount: 2

# Mesmos nomes que os manifests de k8s/base, para não haver dois conjuntos de
# objetos a servir a mesma aplicação quando o ArgoCD assumir a gestão.
fullnameOverride: quinta-web

image:
  repository: quinta-calvario
  tag: "1.0.0"
  # IfNotPresent é obrigatório aqui: a imagem NÃO está em registo nenhum.
  # Foi importada para os nós com `k3d image import`. Com Always, o kubelet
  # tentaria puxá-la de um registo remoto e ficaria em ImagePullBackOff.
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# Secret com as credenciais e a configuração do NextAuth.
# Criado fora do chart e fora do Git — ver k8s/examples/postgres-secret.example.yaml.
# O chart assume que já existe; se faltar, os pods ficam em
# CreateContainerConfigError, que é o comportamento pretendido: melhor falhar
# à vista do que arrancar sem base de dados.
secret:
  name: quinta-db
  keys:
    - DATABASE_URL
    - NEXTAUTH_SECRET
    - NEXTAUTH_URL

ingress:
  enabled: true
  className: nginx
  host: quinta.localhost
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  # Ingress adicional sem `host`, que aceita qualquer cabeçalho Host.
  # Necessário para o acesso por túnel (cloudflared): com uma regra de host
  # fixa, o Host que chega à aplicação teria de ser reescrito, e isso parte o
  # login do NextAuth em silêncio. Ver docs/09-troubleshooting.md.
  # Desativado em 15/08/2026: com a DMZ do router ativa, um Ingress sem host
  # responde a qualquer pedido que chegue ao IP público, expondo a aplicação
  # a quem apenas acerte no endereço. Manter apenas regras com host explícito.
  catchAll: false

# Espelha o securityContext dos manifests de k8s/base. Sem isto, o chart
# faria o deployment regredir para menos restrições do que já estava a correr.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 20
    periodSeconds: 15
