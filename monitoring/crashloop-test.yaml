# Deployment descartável para testar o alerta PodCrashLooping.
#
# PORQUÊ um pod à parte e não a Quinta: a Quinta é gerida pelo ArgoCD com
# self-heal. Estragá-la de propósito faz o ArgoCD repor a versão do Git em
# 1-2 segundos — o pod nunca chega a entrar em CrashLoopBackOff e o alerta
# nunca dispara. Ver docs/07-gitops.md.
#
# Este Deployment não está em nenhuma Application do ArgoCD, portanto ninguém
# o repõe. Vive no namespace `quinta` só para ser apanhado pelas regras, que
# filtram por namespace.
#
# Aplicar:  kubectl apply -f monitoring/crashloop-test.yaml
# Remover:  kubectl delete -f monitoring/crashloop-test.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-test
  namespace: quinta
  labels:
    app.kubernetes.io/name: crashloop-test
    app.kubernetes.io/part-of: alta-disponibilidade
    teste: temporario
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crashloop-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crashloop-test
    spec:
      # Sem restartPolicy definida (o valor por omissão num Deployment é
      # Always), o kubelet reinicia o container em ciclo — que é exatamente
      # o comportamento que se quer provocar.
      containers:
        - name: falha
          image: busybox:1.36
          # Arranca, escreve e morre com código 1. O backoff do kubelet vai
          # aumentando o intervalo (10s, 20s, 40s...), por isso os primeiros
          # reinícios são rápidos e é aí que o alerta acumula.
          command: ["sh", "-c", "echo 'a falhar de proposito'; sleep 5; exit 1"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
