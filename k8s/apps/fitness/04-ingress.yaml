# =============================================================================
#  Ingress NGINX — DOIS objetos, de propósito.
#
#  Porquê separados e não um Ingress com dois hosts?
#  A annotation `cert-manager.io/cluster-issuer` aplica-se ao Ingress INTEIRO.
#  Se pusesses os dois hosts no mesmo objeto, o cert-manager ia tentar emitir um
#  certificado Let's Encrypt também para `fitness.localhost` — e falhava sempre,
#  porque `.localhost` não é um domínio público e não é validável por ACME.
#
#  ESTADO ATUAL (11/09/2026): o cert-manager ESTÁ instalado (v1.21.2) e existe o
#  ClusterIssuer `letsencrypt-prod`. Por isso este ficheiro passou a ter TRÊS
#  Ingress em vez de dois — pela mesma razão explicada acima:
#
#    - `fitnessphive-local`   → fitness.localhost          → autoassinado
#    - `fitnessphive-public`  → renatovdsilva.ddns.net     → LET'S ENCRYPT
#    - `fitnessphive-tailnet` → alien.tail377879.ts.net    → autoassinado
#
#  O host da tailnet teve de sair do Ingress público: `*.ts.net` resolve para um
#  IP 100.x, que não é alcançável da internet, e por isso o desafio HTTP-01 da
#  Let's Encrypt falharia — e uma falha num host faz falhar o certificado todo.
#
#  DUAS CORREÇÕES APRENDIDAS EM PRODUÇÃO — não as desfaças:
#   1) A porta do backend é referida por NÚMERO, não por nome. O Service não
#      define `name: http` nas portas, e referir um nome inexistente faz o
#      NGINX devolver 503 com upstream vazio, sem erro visível em lado nenhum.
#   2) O `auth-realm` só pode ter ASCII. Cabeçalhos HTTP não levam acentos, e o
#      webhook de validação do NGINX rejeita o Ingress inteiro — silenciosamente,
#      no caso de um apply em lote.
# =============================================================================

# -----------------------------------------------------------------------------
#  1) ACESSO LOCAL — fitness.localhost
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fitnessphive-local
  namespace: fitness
  labels:
    app.kubernetes.io/name: fitnessphive
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # Autenticação básica também aqui: a app não tem login nenhum, e assim o
    # comportamento é igual em casa e fora.
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: fitness-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "FitnessPHIVE"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - fitness.localhost
      secretName: fitness-tls          # autoassinado, criado à mão
  rules:
    - host: fitness.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fitnessphive
                port:
                  number: 80

---
# -----------------------------------------------------------------------------
#  2) ACESSO EXTERNO — renatovdsilva.ddns.net
#
#  Exposto à internet por ENCAMINHAMENTO DE PORTAS no router (80 e 443 para
#  192.168.1.200). A DMZ foi desligada e não volta: expunha a máquina inteira.
#  Aqui só passam duas portas.
#
#  Tem obrigatoriamente:
#    - autenticação básica (a app não tem login próprio)
#    - rate limit (trava brute-force e scanners)
#    - TLS válido, emitido pela Let's Encrypt e renovado automaticamente
#
#  A porta 80 tem de estar aberta: é por lá que entra o desafio HTTP-01 do ACME.
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fitnessphive-public
  namespace: fitness
  labels:
    app.kubernetes.io/name: fitnessphive
  annotations:
    # Emissão e renovação automáticas do certificado. Só funciona porque este
    # Ingress tem UM único host, e esse host é público e validável.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # --- Autenticação básica ---------------------------------------------
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: fitness-basic-auth
    # SÓ ASCII. Ver nota no topo do ficheiro.
    nginx.ingress.kubernetes.io/auth-realm: "FitnessPHIVE"
    # --- Travão a scanners e brute-force ---------------------------------
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-connections: "20"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - renatovdsilva.ddns.net
      # Criado e renovado pelo cert-manager. NÃO criar este Secret à mão.
      secretName: fitness-tls-ddns
  rules:
    - host: renatovdsilva.ddns.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fitnessphive
                port:
                  number: 80

---
# -----------------------------------------------------------------------------
#  3) ACESSO PELA TAILNET — alien.tail377879.ts.net
#
#  Separado do Ingress público desde 11/09/2026, para não arrastar consigo o
#  certificado Let's Encrypt. Continua com certificado autoassinado, o que não
#  é problema: só dispositivos autenticados na tailnet lá chegam.
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fitnessphive-tailnet
  namespace: fitness
  labels:
    app.kubernetes.io/name: fitnessphive
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: fitness-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "FitnessPHIVE"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - alien.tail377879.ts.net
      secretName: fitness-tls-public     # autoassinado, criado à mão
  rules:
    - host: alien.tail377879.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fitnessphive
                port:
                  number: 80
