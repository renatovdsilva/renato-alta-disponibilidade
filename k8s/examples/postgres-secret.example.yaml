# EXEMPLO — não aplicar como está e nunca commitar a versão preenchida.
#
# Fora de k8s/base/ de propósito, para que `kubectl apply -f k8s/base/`
# nunca aplique placeholders por engano.
#
# Criar pela linha de comandos, sem ficheiro intermédio (D7). A password
# aparece em dois sítios — na chave POSTGRES_PASSWORD e dentro da
# DATABASE_URL — por isso convém gerá-la primeiro para uma variável:
#
#   PGPASS="$(openssl rand -base64 24 | tr -d '/+=')"
#
#   kubectl create secret generic quinta-db -n quinta \
#     --from-literal=POSTGRES_DB=quinta \
#     --from-literal=POSTGRES_USER=quinta \
#     --from-literal=POSTGRES_PASSWORD="$PGPASS" \
#     --from-literal=DATABASE_URL="postgresql://quinta:${PGPASS}@postgres-0.postgres.quinta.svc.cluster.local:5432/quinta?schema=public" \
#     --from-literal=NEXTAUTH_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=NEXTAUTH_URL="http://quinta.localhost"
#
# O `tr -d '/+='` evita carateres que teriam de ser escapados dentro do URL.
#
# NEXTAUTH_URL é o host pelo qual o utilizador chega à aplicação — o do
# Ingress. Cada ambiente precisa do seu Secret: em dev o host é
# quinta-dev.localhost (ver charts/quinta/values-dev.yaml).
#
apiVersion: v1
kind: Secret
metadata:
  name: quinta-db
  namespace: quinta
type: Opaque
stringData:
  POSTGRES_DB: quinta
  POSTGRES_USER: quinta
  POSTGRES_PASSWORD: SUBSTITUIR-NUNCA-COMMITAR
  # Consumida pelo Prisma através de env("DATABASE_URL") no schema.prisma.
  # O host é o nome DNS do pod 0 via Service headless.
  DATABASE_URL: postgresql://quinta:SUBSTITUIR-NUNCA-COMMITAR@postgres-0.postgres.quinta.svc.cluster.local:5432/quinta?schema=public
  # NextAuth: sem o secret, 500 em /api/auth/error com NO_SECRET.
  # Gerar com: openssl rand -base64 32
  NEXTAUTH_SECRET: SUBSTITUIR-NUNCA-COMMITAR
  # Host público da aplicação, usado para construir os URLs de callback.
  NEXTAUTH_URL: http://quinta.localhost
