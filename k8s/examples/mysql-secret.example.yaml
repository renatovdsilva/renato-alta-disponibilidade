# EXEMPLO — não aplicar como está e nunca commitar a versão preenchida.
#
# Está fora de k8s/base/ de propósito: assim `kubectl apply -f k8s/base/`
# nunca aplica placeholders por engano.
#
# Decisão D7: nenhum segredo no repositório. A forma recomendada é criar o
# Secret pela linha de comandos, sem ficheiro intermédio nenhum:
#
#   kubectl create secret generic briosa-db -n briosa \
#     --from-literal=DB_HOST=mysql-0.mysql.briosa.svc.cluster.local \
#     --from-literal=DB_PORT=3306 \
#     --from-literal=DB_NAME=agenda_briosa \
#     --from-literal=DB_CHARSET=utf8mb4 \
#     --from-literal=DB_USER=briosa \
#     --from-literal=DB_PASSWORD='<password-da-aplicacao>' \
#     --from-literal=MYSQL_ROOT_PASSWORD='<password-de-root>'
#
# Gerar passwords: openssl rand -base64 24
#
apiVersion: v1
kind: Secret
metadata:
  name: briosa-db
  namespace: briosa
type: Opaque
stringData:
  # Nome DNS do pod 0 através do Service headless.
  DB_HOST: mysql-0.mysql.briosa.svc.cluster.local
  DB_PORT: "3306"
  # Nome único, resolvendo a divergência entre o config (briosate_agenda)
  # e o schema.sql (agenda_briosa) — ver problema 2 no doc 03.
  DB_NAME: agenda_briosa
  DB_CHARSET: utf8mb4
  DB_USER: briosa
  DB_PASSWORD: SUBSTITUIR-NUNCA-COMMITAR
  MYSQL_ROOT_PASSWORD: SUBSTITUIR-NUNCA-COMMITAR
