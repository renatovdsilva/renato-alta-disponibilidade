# EXEMPLO — não aplicar como está, não commitar preenchido.
#
# Criar pela linha de comandos, sem ficheiro intermédio (D7). Ajustar as
# chaves ao que o Deployment do RenatoTrack espera — confirmar com:
#
#   kubectl -n renatotrack get secret renatotrack-postgres -o jsonpath='{.data}' | jq 'keys'
#
#   PGPASS="$(openssl rand -base64 24 | tr -d '/+=')"
#
#   kubectl create secret generic renatotrack-postgres -n renatotrack \
#     --from-literal=POSTGRES_DB=renatotrack \
#     --from-literal=POSTGRES_USER=renatotrack \
#     --from-literal=POSTGRES_PASSWORD="$PGPASS" \
#     --from-literal=DATABASE_URL="postgresql://renatotrack:${PGPASS}@<host-do-service>:5432/renatotrack"
#
apiVersion: v1
kind: Secret
metadata:
  name: renatotrack-postgres
  namespace: renatotrack
type: Opaque
stringData:
  POSTGRES_DB: renatotrack
  POSTGRES_USER: renatotrack
  POSTGRES_PASSWORD: SUBSTITUIR-NUNCA-COMMITAR
  DATABASE_URL: postgresql://renatotrack:SUBSTITUIR@<host>:5432/renatotrack
