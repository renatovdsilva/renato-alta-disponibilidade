# ─────────────────────────────────────────────────────────────────────────────
# Inventário do Ansible.
#
# A máquina onde o cluster corre é a própria máquina onde o Ansible corre
# (o Ubuntu do WSL2). Por isso o host é `localhost` com ligação `local`:
# o Ansible não abre SSH nenhum, executa os módulos diretamente.
#
# Quando um dia houver nós verdadeiros — VMs ou máquinas físicas — basta
# acrescentar um grupo novo com os endereços e o resto dos playbooks
# continua a funcionar sem alterações.
# ─────────────────────────────────────────────────────────────────────────────

[workstation]
localhost ansible_connection=local

[workstation:vars]
ansible_python_interpreter=/usr/bin/python3

