---
# ─────────────────────────────────────────────────────────────────────────────
# Playbook: instalação das ferramentas de base da estação de trabalho.
#
# Substitui o passo manual descrito em docs/01b-instalacao-ferramentas.md.
# É idempotente: correr duas vezes seguidas não altera nada na segunda.
#
# Correr com:
#     ansible-playbook -i inventory.ini ferramentas.yml --ask-become-pass
#
# Para ver o que mudaria sem alterar nada:
#     ansible-playbook -i inventory.ini ferramentas.yml --check --diff
# ─────────────────────────────────────────────────────────────────────────────

- name: Preparar a estação de trabalho para o cluster
  hosts: workstation
  become: true

  vars:
    kubectl_version: "v1.35.5"          # igual à versão do k3s do cluster
    k3d_version: "v5.8.3"
    helm_version: "v3.16.3"
    arch: amd64

  tasks:

    # ── Pacotes de sistema ───────────────────────────────────────────────────
    - name: Atualizar a cache do apt
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Instalar pacotes de base
      ansible.builtin.apt:
        name:
          - curl
          - git
          - jq
          - apache2-utils      # htpasswd, usado para os secrets de basic auth
          - ca-certificates
          - gnupg
        state: present

    # ── kubectl ──────────────────────────────────────────────────────────────
    # Não uso o apt aqui de propósito: a versão do kubectl tem de acompanhar a
    # do k3s, e o repositório da distribuição anda quase sempre atrasado.
    # `check_mode: false` é obrigatório aqui. Sem isto, num `--check` o módulo
    # command é saltado, a variável fica sem `rc`, e a condição da tarefa
    # seguinte rebenta com "dict object has no attribute 'rc'".
    # Tarefas que só LEEM estado têm de correr também em modo de simulação.
    - name: Verificar se o kubectl já está instalado na versão pretendida
      ansible.builtin.command: kubectl version --client -o json
      register: kubectl_check
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Instalar o kubectl
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/{{ arch }}/kubectl"
        dest: /usr/local/bin/kubectl
        mode: "0755"
        owner: root
        group: root
      when: kubectl_version not in (kubectl_check.stdout | default(''))

    # ── Helm ─────────────────────────────────────────────────────────────────
    - name: Verificar se o Helm está instalado
      ansible.builtin.command: helm version --short
      register: helm_check
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Instalar o Helm
      ansible.builtin.unarchive:
        src: "https://get.helm.sh/helm-{{ helm_version }}-linux-{{ arch }}.tar.gz"
        dest: /tmp
        remote_src: true
        creates: "/tmp/linux-{{ arch }}/helm"
      when: helm_check.rc != 0

    - name: Colocar o binário do Helm no PATH
      ansible.builtin.copy:
        src: "/tmp/linux-{{ arch }}/helm"
        dest: /usr/local/bin/helm
        mode: "0755"
        remote_src: true
      when: helm_check.rc != 0

    # ── k3d ──────────────────────────────────────────────────────────────────
    - name: Verificar se o k3d está instalado
      ansible.builtin.command: k3d version
      register: k3d_check
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Instalar o k3d
      ansible.builtin.get_url:
        url: "https://github.com/k3d-io/k3d/releases/download/{{ k3d_version }}/k3d-linux-{{ arch }}"
        dest: /usr/local/bin/k3d
        mode: "0755"
        owner: root
        group: root
      when: k3d_check.rc != 0

    # ── Verificação final ────────────────────────────────────────────────────
    - name: Recolher as versões instaladas
      ansible.builtin.command: "{{ item }}"
      register: versoes
      changed_when: false
      failed_when: false
      check_mode: false
      loop:
        - kubectl version --client -o yaml
        - helm version --short
        - k3d version

    - name: Mostrar as versões instaladas
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ versoes.results }}"
      loop_control:
        label: "{{ item.item }}"
